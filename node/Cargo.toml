[package]
name = "railid-node"
version = "1.1.1"
edition = "2021"
rust-version = "1.88"
description = "Native N-API bindings for RailID"
readme = "README.md"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]

[features]
default = ["tpm"]
# Build with the railid TPM hybrid backend. Disable for an OS-only binary.
tpm = ["railid/tpm"]

[dependencies]
napi = { version = "=3.16.3", features = ["napi8"] }
napi-derive = "=3.7.2"
railid = { path = "..", default-features = false }

[build-dependencies]
napi-build = "=2.7.0"
