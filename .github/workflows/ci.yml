name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85"
          components: rustfmt, clippy

      - name: Install TSS development files (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libtss2-dev

      - name: Format
        run: cargo fmt --check

      - name: Test (core)
        run: cargo test

      - name: Test (TPM feature)
        run: cargo test --features tpm

      - name: Test railid-tpm
        if: runner.os == 'Linux'
        run: cargo test --manifest-path railid-tpm/Cargo.toml --features linux

      - name: Test railid-tpm
        if: runner.os == 'Windows'
        run: cargo test --manifest-path railid-tpm/Cargo.toml --features windows

      - name: Clippy
        run: cargo clippy --all-targets --features tpm -- -D warnings

      - name: Documentation
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --no-deps --features tpm
