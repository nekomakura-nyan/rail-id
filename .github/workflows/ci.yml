name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85"
          components: rustfmt, clippy

      - name: Install TSS development files (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libtss2-dev

      - name: Format
        run: cargo fmt --check

      - name: Test (core)
        run: cargo test

      - name: Test (TPM feature)
        run: cargo test --features tpm

      - name: Test railid-tpm
        if: runner.os == 'Linux'
        run: cargo test --manifest-path railid-tpm/Cargo.toml --features linux

      - name: Test railid-tpm
        if: runner.os == 'Windows'
        run: cargo test --manifest-path railid-tpm/Cargo.toml --features windows

      - name: Clippy
        run: cargo clippy --all-targets --features tpm -- -D warnings

      - name: Documentation
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --no-deps --features tpm

  node-linux-gnu:
    name: node (linux-x64-gnu)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88"

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install TSS development files
        run: sudo apt-get update && sudo apt-get install -y pkg-config libtss2-dev

      - name: Build native addons (TPM + OS-only)
        working-directory: node
        run: node scripts/build.js --target linux-x64-gnu

      - name: Test native addon
        working-directory: node
        run: node test.js

      - name: Verify binaries
        working-directory: node
        run: node scripts/verify.js --target linux-x64-gnu

      - uses: actions/upload-artifact@v7
        with:
          name: railid-node-linux-x64-gnu
          path: |
            node/railid.linux-x64-gnu.node
            node/railid-tpm.linux-x64-gnu.node
          if-no-files-found: error

  node-linux-musl-x64:
    name: node (linux-x64-musl)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Build musl addon
        run: docker run --rm -v "$PWD:/src" -w /src/node rust:1.88-alpine sh scripts/build-in-docker.sh linux-x64-musl

      - name: Test musl addon
        run: docker run --rm -v "$PWD:/src" -w /src/node node:24-alpine node test.js

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Verify binaries
        working-directory: node
        run: node scripts/verify.js --target linux-x64-musl

      - uses: actions/upload-artifact@v7
        with:
          name: railid-node-linux-x64-musl
          path: node/railid.linux-x64-musl.node
          if-no-files-found: error

  node-linux-arm64:
    name: node (linux-arm64)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88"

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Build glibc addon
        working-directory: node
        run: node scripts/build.js --target linux-arm64-gnu

      - name: Test glibc addon
        working-directory: node
        run: node test.js

      - name: Build musl addon
        run: docker run --rm -v "$PWD:/src" -w /src/node rust:1.88-alpine sh scripts/build-in-docker.sh linux-arm64-musl

      - name: Test musl addon
        run: docker run --rm -v "$PWD:/src" -w /src/node node:24-alpine node test.js

      - name: Verify binaries
        working-directory: node
        run: node scripts/verify.js

      - uses: actions/upload-artifact@v7
        with:
          name: railid-node-linux-arm64
          path: |
            node/railid.linux-arm64-gnu.node
            node/railid.linux-arm64-musl.node
          if-no-files-found: error

  node-linux-cross:
    name: node (linux-armv7, linux-riscv64)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88"

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install cross toolchains
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-linux-gnueabihf libc6-dev-armhf-cross \
            gcc-riscv64-linux-gnu libc6-dev-riscv64-cross

      - name: Add Rust targets
        run: rustup target add armv7-unknown-linux-gnueabihf riscv64gc-unknown-linux-gnu

      - name: Build armv7 addon
        working-directory: node
        env:
          CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_LINKER: arm-linux-gnueabihf-gcc
        run: node scripts/build.js --target linux-arm-gnu

      - name: Build riscv64 addon
        working-directory: node
        env:
          CARGO_TARGET_RISCV64GC_UNKNOWN_LINUX_GNU_LINKER: riscv64-linux-gnu-gcc
        run: node scripts/build.js --target linux-riscv64-gnu

      - name: Verify binaries
        working-directory: node
        run: node scripts/verify.js --target linux-arm-gnu && node scripts/verify.js --target linux-riscv64-gnu

      - name: Enable foreign-architecture containers
        run: docker run --privileged --rm tonistiigi/binfmt --install arm,riscv64

      - name: Test armv7 addon (Node 18)
        run: docker run --rm --platform linux/arm/v7 -v "$PWD:/src" -w /src/node debian:bookworm-slim sh -c "apt-get update -qq && apt-get install -y -qq nodejs >/dev/null && node test.js"

      - name: Test riscv64 addon (Node 18)
        run: docker run --rm --platform linux/riscv64 -v "$PWD:/src" -w /src/node ubuntu:24.04 sh -c "apt-get update -qq && apt-get install -y -qq nodejs >/dev/null && node test.js"

      - uses: actions/upload-artifact@v7
        with:
          name: railid-node-linux-cross
          path: |
            node/railid.linux-arm-gnu.node
            node/railid.linux-riscv64-gnu.node
          if-no-files-found: error

  node-windows-x64:
    name: node (win32-x64-msvc)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88"

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Build native addon
        working-directory: node
        run: node scripts/build.js --target win32-x64-msvc

      - name: Test native addon
        working-directory: node
        run: node test.js

      - name: Verify binaries
        working-directory: node
        run: node scripts/verify.js --target win32-x64-msvc

      - uses: actions/upload-artifact@v7
        with:
          name: railid-node-win32-x64
          path: node/railid.win32-x64-msvc.node
          if-no-files-found: error

  node-windows-arm64:
    name: node (win32-arm64-msvc)
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88"

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Build native addon
        working-directory: node
        run: node scripts/build.js --target win32-arm64-msvc

      - name: Test native addon
        working-directory: node
        run: node test.js

      - name: Verify binaries
        working-directory: node
        run: node scripts/verify.js --target win32-arm64-msvc

      - uses: actions/upload-artifact@v7
        with:
          name: railid-node-win32-arm64
          path: node/railid.win32-arm64-msvc.node
          if-no-files-found: error

  node-macos:
    name: node (darwin arm64 native, x64 cross)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88"

      - name: Add macOS targets
        run: rustup target add x86_64-apple-darwin aarch64-apple-darwin

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Build both slices
        working-directory: node
        run: node scripts/build.js

      - name: Test arm64 addon
        working-directory: node
        run: node test.js

      - name: Verify binaries
        working-directory: node
        run: node scripts/verify.js

      - uses: actions/upload-artifact@v7
        with:
          name: railid-node-darwin
          path: |
            node/railid.darwin-x64.node
            node/railid.darwin-arm64.node
          if-no-files-found: error

  node-node-versions:
    name: node ${{ matrix.node }} (${{ matrix.libc }})
    needs: [node-linux-gnu, node-linux-musl-x64]
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        node: ["18", "20", "22", "24"]
        libc: [gnu, musl]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: railid-node-linux-x64-*
          path: node
          merge-multiple: true

      - name: Test under Node ${{ matrix.node }}
        run: |
          IMAGE="node:${{ matrix.node }}${{ matrix.libc == 'musl' && '-alpine' || '' }}"
          docker run --rm -v "$PWD:/src" -w /src/node "$IMAGE" node test.js

  node-package:
    name: node package
    needs:
      - node-linux-gnu
      - node-linux-musl-x64
      - node-linux-arm64
      - node-linux-cross
      - node-windows-x64
      - node-windows-arm64
      - node-macos
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - uses: actions/download-artifact@v8
        with:
          pattern: railid-node-*
          path: node
          merge-multiple: true

      - name: Verify binaries
        working-directory: node
        run: node scripts/verify.js

      - name: Build tarball
        working-directory: node
        run: npm pack

      - name: Verify tarball contents
        working-directory: node
        run: |
          set -eu
          TARBALL=$(ls *.tgz)
          tar -tzf "$TARBALL"
          for addon in \
            railid.linux-x64-gnu.node \
            railid-tpm.linux-x64-gnu.node \
            railid.linux-x64-musl.node \
            railid.linux-arm64-gnu.node \
            railid.linux-arm64-musl.node \
            railid.linux-arm-gnu.node \
            railid.linux-riscv64-gnu.node \
            railid.win32-x64-msvc.node \
            railid.win32-arm64-msvc.node \
            railid.darwin-x64.node \
            railid.darwin-arm64.node; do
            tar -tzf "$TARBALL" | grep -qx "package/$addon" || {
              echo "missing $addon" >&2
              exit 1
            }
          done
          test "$(tar -tzf "$TARBALL" | grep -c '\.node$')" -eq 11

      - uses: actions/upload-artifact@v7
        with:
          name: railid-npm-package
          path: node/*.tgz
          if-no-files-found: error
